plugins {
  id 'com.android.library'
  id 'kotlin-parcelize'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stillreminders'
version = '1.0.0'

android {
  namespace 'expo.modules.stillreminders'
}

dependencies {
  def notifications = findProject(':expo-notifications')
  if (notifications) {
    implementation notifications
  } else {
    // SDK 58 normally links the Maven artifact bundled with expo-notifications.
    def manifest = rootProject.file('../node_modules/expo-notifications/package.json')
    def version = new groovy.json.JsonSlurper().parse(manifest).version
    implementation "host.exp.exponent:expo.modules.notifications:${version}"
  }
}
